version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: hhgoa-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  api:
    build: .
    container_name: hhgoa-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./app:/app/app          # hot-reload in dev
      - model_cache:/root/.cache  # persist downloaded models
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
